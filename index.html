<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HFC - Folha de Ponto</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background: #f4f6f8;
      color: #1a2733;
    }
    .card {
      background: #ffffff;
      padding: 3rem 4rem;
      border-radius: 12px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
      text-align: center;
    }
    h1 { margin: 0 0 0.5rem; }
    p { margin: 0; color: #5a6b7b; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Hello, world!</h1>
    <p>HFC - Sistema de Folha de Ponto dos Preceptores</p>
  </div>
</body>
</html>
